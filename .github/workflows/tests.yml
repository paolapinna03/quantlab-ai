# Test automatici a ogni push e pull request (solo quelli offline, veloci e deterministici).
name: Test

on:
  push:
    paths-ignore: ["state/**"]   # i commit del bot del paper trading non rilanciano i test
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Test offline
        env:
          QUANTLAB_PAPER_DB: ${{ runner.temp }}/paper-test.sqlite
          QUANTLAB_DB: ${{ runner.temp }}/exp-test.sqlite
        run: pytest -q
